<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <title>Joget Skin</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 14px/1.4 system-ui, sans-serif;
      }
      body {
        margin: 12px 14px;
        min-width: 260px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      .top-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .version {
        color: #888;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 10px;
        cursor: default;
      }
      .check-row {
        margin-top: 10px;
      }
      select,
      button {
        font: inherit;
        padding: 2px 6px;
      }
      .sound-row {
        margin-top: 6px;
        padding-left: 24px;
        justify-content: flex-start;
      }
      .sound-row select {
        flex: 1;
      }
      button {
        cursor: pointer;
      }
      select:disabled,
      button:disabled,
      .check-row.disabled {
        opacity: 0.5;
      }
      .hint {
        margin: 10px 0 0;
        color: #666;
        font-size: 12px;
      }
      .update-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        margin-top: 10px;
      }
      .update-status {
        color: #555;
        font-size: 12px;
        text-align: right;
        flex: 1;
        min-width: 0;
      }
      .update-status a {
        color: #1d4ed8;
      }
      .update-actions {
        margin-top: 4px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: flex-end;
      }
      .update-hint {
        display: none;
        margin: 6px 0 0;
        color: #8a5a00;
        font-size: 11px;
      }
      .update-hint.show {
        display: block;
      }
      @media (prefers-color-scheme: dark) {
        .hint,
        .version,
        .update-status {
          color: #aaa;
        }
        .update-status a {
          color: #93c5fd;
        }
        .update-hint {
          color: #fbbf24;
        }
      }
    </style>
  </head>
  <body>
    <div class="top-row">
      <label>
        <input type="checkbox" id="toggle" />
        <span>启用 Joget Skin</span>
      </label>
      <span class="version" id="version"></span>
    </div>
    <div class="update-row">
      <button type="button" id="update-check">检查更新</button>
      <div id="update-status" class="update-status" role="status" aria-live="polite"></div>
    </div>
    <p id="update-hint" class="update-hint"></p>
    <label class="row" for="theme">
      <span>主题</span>
      <select id="theme">
        <option value="default">原本 (Joget 默认)</option>
        <option value="indigo">Indigo</option>
      </select>
    </label>
    <label class="check-row" id="chime-row">
      <input type="checkbox" id="chime" />
      <span>保存成功提示音</span>
    </label>
    <div class="row sound-row">
      <select id="sound" aria-label="提示音">
        <option value="soft">柔和叮咚</option>
        <option value="marimba">木琴</option>
        <option value="bubble">泡泡</option>
      </select>
      <button type="button" id="preview">试听</button>
    </div>
    <p class="hint">关闭后隐藏项、App Composer 布局、主题和提示音全部还原成 Joget 原样，不用刷新页面。</p>
    <script src="chime-sound.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
