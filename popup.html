<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <title>Joget Skin</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 14px/1.4 system-ui, sans-serif;
      }
      body {
        margin: 12px 14px;
        min-width: 220px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      .top-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .version {
        color: #888;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 10px;
        cursor: default;
      }
      .check-row {
        margin-top: 10px;
      }
      select {
        font: inherit;
        padding: 2px 4px;
      }
      select:disabled,
      .check-row.disabled {
        opacity: 0.5;
      }
      .hint {
        margin: 10px 0 0;
        color: #666;
        font-size: 12px;
      }
      @media (prefers-color-scheme: dark) {
        .hint,
        .version {
          color: #aaa;
        }
      }
    </style>
  </head>
  <body>
    <div class="top-row">
      <label>
        <input type="checkbox" id="toggle" />
        <span>启用 Joget Skin</span>
      </label>
      <span class="version" id="version"></span>
    </div>
    <label class="row" for="theme">
      <span>主题</span>
      <select id="theme">
        <option value="default">原本 (Joget 默认)</option>
        <option value="indigo">Indigo</option>
      </select>
    </label>
    <label class="check-row" id="chime-row">
      <input type="checkbox" id="chime" />
      <span>保存成功提示音</span>
    </label>
    <p class="hint">关闭后隐藏项、App Composer 布局、主题和提示音全部还原成 Joget 原样，不用刷新页面。</p>
    <script src="popup.js"></script>
  </body>
</html>
